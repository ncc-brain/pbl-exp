[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pbl-exp"
dynamic = ["version"]
description = "Helper functions for running experiments at the Predictive Brain Lab (Bochum)"
readme = "README.md"
authors = [{ name = "Qian Chu", email = "qianchu99@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["psychopy", "pupil-labs-realtime-api", "sr-research-pylink", "pylsl"]

[project.optional-dependencies]
docs = ["sphinx", "pydata-sphinx-theme", "numpydoc", "myst-parser"]
dev = ["pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "node-and-date"
